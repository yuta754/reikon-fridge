<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ジャンル別 食品廃棄率</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
    <style>
        :root {
            --primary-color: #0077b6;
            --secondary-color: #00b4d8;
            --danger-color: #e63946;
            --background-dark: #e6f7ff;
            --card-background: #ffffff;
            --text-on-dark: #333;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #333;
            margin: 0;
            padding: 20px;
            background-color: var(--background-dark);
            min-height: 100vh;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: var(--card-background);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid var(--secondary-color);
            padding-bottom: 15px;
            margin-bottom: 30px;
            gap: 15px;
            flex-wrap: wrap;
        }

        .header-title {
            color: var(--primary-color);
            margin: 0;
            font-size: 1.8em;
            font-weight: 600;
            text-align: center;
            flex-grow: 1;
        }

        .header-link {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: bold;
            padding: 8px 15px;
            white-space: nowrap;
            font-size: 0.9em;
            transition: color 0.2s;
        }
        .header-link:hover {
            color: var(--secondary-color);
        }

        .logout-button {
            background-color: var(--background-dark);
            color: var(--primary-color);
            border: 1px solid var(--primary-color);
            padding: 8px 15px;
            cursor: pointer;
            border-radius: 20px;
            transition: all 0.2s;
            font-size: 0.9em;
            white-space: nowrap;
        }
        .logout-button:hover {
            background-color: var(--primary-color);
            color: white;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .controls {
            margin-bottom: 25px;
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 15px;
            padding: 15px;
            border-top: 1px solid #eee;
            border-bottom: 1px solid #eee;
            background-color: #fcfcfc;
            border-radius: 8px;
        }
        
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-width: 200px;
        }
        
        .controls label { 
            font-weight: 600; 
            color: #555;
            font-size: 0.9em;
        }
        
        .controls select {
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--secondary-color);
            background-color: #fff;
            box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.05);
            width: 100%;
            font-size: 0.95em;
        }

        .chart-container {
            text-align: center;
            padding: 20px;
            border-radius: 8px;
            background-color: #fcfcfc;
            margin-bottom: 30px;
        }
        
        .chart-wrapper {
            position: relative;
            width: 100%;
            max-width: 525px;
            margin: 0 auto;
        }
        
        #wastePieChart {
            width: 100% !important;
            height: auto !important;
        }
        
        .chart-container h2 {
            color: var(--primary-color);
            border-bottom: 1px dashed #ccc;
            padding-bottom: 10px;
            margin-bottom: 20px;
            font-size: 1.4em;
            text-align: center;
        }
        
        #colorLegend {
            border: 1px solid var(--secondary-color);
            padding: 15px;
            border-radius: 8px;
            background-color: #e6f7ff;
            font-size: 0.9em;
            text-align: left;
            display: inline-block;
            margin-top: 20px;
            max-width: 100%;
        }

        .trend-panel {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background-color: #ffffff;
            width: fit-content;
            max-width: 100%;
            margin-left: auto;
            margin-right: auto;
        }

        h2 {
            color: var(--primary-color);
            font-size: 1.4em;
            margin-top: 30px;
            margin-bottom: 15px;
        }
        
        .table-wrapper {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            border-radius: 8px;
            overflow: hidden;
            min-width: 300px;
        }
        
        th, td {
            border: none;
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }
        
        th {
            background-color: var(--primary-color);
            color: white;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.9em;
        }
        
        tr:nth-child(even) { background-color: #f9f9f9; }
        tr:hover td { background-color: #e0f7fa; }

        .detail-table th {
            background-color: var(--danger-color) !important;
            color: white !important;
        }

        /* スマホ対応 */
        @media (max-width: 768px) {
            body {
                padding: 12px;
            }

            .container {
                padding: 20px 15px;
            }

            .header-container {
                flex-direction: column;
                align-items: stretch;
                padding-bottom: 12px;
                margin-bottom: 20px;
            }

            .header-title {
                font-size: 1.4em;
                order: 1;
                margin-bottom: 10px;
            }

            .header-link {
                order: 0;
                padding: 6px 10px;
                font-size: 0.85em;
                align-self: flex-start;
            }

            .logout-button {
                order: 2;
                padding: 7px 12px;
                font-size: 0.85em;
                align-self: flex-end;
            }

            .controls {
                flex-direction: column;
                padding: 12px;
                gap: 12px;
            }

            .control-group {
                min-width: 100%;
            }

            .controls label {
                font-size: 0.85em;
            }

            .controls select {
                padding: 8px;
                font-size: 0.9em;
            }

            .chart-container {
                padding: 15px 10px;
            }

            .chart-container h2 {
                font-size: 1.2em;
                margin-bottom: 15px;
            }

            .chart-wrapper {
                max-width: 100%;
            }

            .trend-panel {
                padding: 12px;
                font-size: 0.9em;
            }

            #colorLegend {
                padding: 12px;
                font-size: 0.85em;
            }

            #selectedGenreRate {
                font-size: 1em !important;
            }

            h2 {
                font-size: 1.2em;
                margin-top: 20px;
            }

            th, td {
                padding: 10px 8px;
                font-size: 0.9em;
            }

            th {
                font-size: 0.85em;
            }
        }

        /* 小型スマホ対応 */
        @media (max-width: 480px) {
            body {
                padding: 10px;
            }

            .container {
                padding: 15px 12px;
            }

            .header-title {
                font-size: 1.2em;
            }

            .header-link {
                font-size: 0.8em;
                padding: 5px 8px;
            }

            .logout-button {
                font-size: 0.8em;
                padding: 6px 10px;
            }

            .controls {
                padding: 10px;
            }

            .chart-container h2 {
                font-size: 1.1em;
            }

            .trend-panel {
                padding: 10px;
                font-size: 0.85em;
            }

            #colorLegend {
                padding: 10px;
                font-size: 0.8em;
            }

            h2 {
                font-size: 1.1em;
            }

            th, td {
                padding: 8px 6px;
                font-size: 0.85em;
            }

            th {
                font-size: 0.8em;
            }
        }

        /* 横向き対応 */
        @media (max-height: 600px) and (orientation: landscape) {
            body {
                padding: 10px;
            }

            .container {
                margin: 10px auto;
            }

            .header-container {
                margin-bottom: 15px;
            }

            .chart-container {
                padding: 10px;
            }

            .trend-panel {
                margin-bottom: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">

        <div class="header-container">
            <a href="/menu" class="header-link">↩ メニュー画面に戻る</a>

            <h1 class="header-title">ジャンル別 食品廃棄率</h1>

            <form method="post" action="/logout" style="margin: 0;">
                <button type="submit" class="logout-button" title="ログアウト">
                    <i class="fa-solid fa-right-from-bracket"></i> ログアウト
                </button>
            </form>
        </div>

        <div class="chart-container">
            <h2>廃棄率 円グラフ</h2>

            <div class="trend-panel">
                <div style="text-align: center;">
                    <p style="font-weight: bold; margin: 0; color: #555;">廃棄率比較 (<span th:text="${currentPeriod}">全期間</span>)</p>
                    <span th:if="${trendStatus == 'down'}" style="color: green; font-size: 1.5em;"><i class="fa-solid fa-arrow-down"></i> 削減傾向</span>
                    <span th:if="${trendStatus == 'up'}" style="color: var(--danger-color); font-size: 1.5em;"><i class="fa-solid fa-arrow-up"></i> 増加傾向</span>
                    <span th:if="${trendStatus == 'stable'}" style="color: var(--primary-color); font-size: 1.5em;"><i class="fa-solid fa-circle-minus"></i> 安定</span>
                </div>
            </div>

            <div style="text-align: center; font-size: 0.85em; color: #666; margin-top: 5px; margin-bottom: 20px;">
                <p style="margin: 0;">
                    ※ 廃棄率比較 : 現期間の廃棄総量を直前期間と比較し、±5%以上の増減で傾向を表示します。
                </p>
            </div>

            <div class="controls">
                <div class="control-group">
                    <label for="periodSelector">期間を選択:</label>
                    <select id="periodSelector" onchange="applyPeriodFilter(this.value)">
                        <option value="all" th:selected="${currentPeriod == 'all'}">全て</option>
                        <option value="week" th:selected="${currentPeriod == 'week'}">今週</option>
                        <option value="month" th:selected="${currentPeriod == 'month'}">今月</option>
                        <option value="year" th:selected="${currentPeriod == 'year'}">今年</option>
                    </select>
                </div>

                <div class="control-group">
                    <label for="genreSelector">表示ジャンルを選択:</label>
                    <select id="genreSelector">
                        <option value="all">全てのジャンル</option>
                        <option th:each="rate : ${wasteRates}" th:value="${rate.genreName}" th:text="${rate.genreName}"></option>
                    </select>
                </div>
            </div>

            <div class="chart-wrapper">
                <canvas id="wastePieChart"></canvas>
            </div>
            
            <p id="selectedGenreRate" style="font-size: 1.2em; font-weight: bold; margin-top: 15px; color: var(--primary-color);"></p>

            <div id="colorLegend" style="margin-top: 20px;">
                <p style="font-weight: bold; margin-bottom: 5px;">【廃棄率レベル (全ジャンル表示時)】</p>
                <div id="legendItems"></div>
            </div>
        </div>

        <h2>全ジャンル 廃棄率一覧</h2>
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>食品ジャンル</th>
                        <th>廃棄率 (%)</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="rate : ${wasteRates}">
                        <td th:text="${rate.genreName}">ジャンル名</td>
                        <td th:text="${#numbers.formatDecimal(rate.wasteRate, 1, 2)} + ' %'">0.00 %</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div id="detailTableContainer">
            <h2><span id="detailHeader"></span>廃棄詳細</h2>
            <div class="table-wrapper">
                <table id="wasteDetailTable" class="detail-table">
                    <thead>
                        <tr>
                            <th style="background-color: var(--danger-color);">食品名</th>
                            <th style="background-color: var(--danger-color);">廃棄量</th>
                            <th style="background-color: var(--danger-color);">ジャンル</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>

    </div>

    <script>
        function applyPeriodFilter(period) {
            window.location.href = '/waste-rate?period=' + period;
        }
    </script>

    <script th:inline="javascript">
        const allWasteRates = [[${wasteRates}]];
        const allWasteDetails = [[${wasteDetails}]];

        const genreSelector = document.getElementById('genreSelector');
        const rateDisplay = document.getElementById('selectedGenreRate');
        const ctx = document.getElementById('wastePieChart').getContext('2d');
        const detailHeader = document.getElementById('detailHeader');
        const detailBody = document.querySelector('#wasteDetailTable tbody');
        const legendContainer = document.getElementById('legendItems');
        let wasteChart;

        const COLOR_HIGH = '#FF6384';
        const COLOR_MEDIUM = '#36A2EB';
        const COLOR_LOW = '#B3B3B3';
        const COLOR_ZERO = '#E0E0E0';

        const legendData = [
            { label: '(40% 超)', color: COLOR_HIGH },
            { label: '(20% 〜 40% 以下)', color: COLOR_MEDIUM },
            { label: '(20% 以下)', color: COLOR_LOW }
        ];

        Chart.register(ChartDataLabels);

        function drawLegend(isAllGenre) {
            legendContainer.innerHTML = '';

            if (isAllGenre) {
                legendData.forEach(item => {
                    const p = document.createElement('p');
                    p.style.margin = '3px 0';
                    p.innerHTML = `<span style="display: inline-block; width: 12px; height: 12px; background-color: ${item.color}; border-radius: 3px; margin-right: 5px;"></span>${item.label}`;
                    legendContainer.appendChild(p);
                });
                document.getElementById('colorLegend').style.display = 'inline-block';
            } else {
                document.getElementById('colorLegend').style.display = 'none';
            }
        }

        function updateChart(selectedGenre) {
            let labels, data, totalRate, titleText;

            if (selectedGenre === 'all') {
                labels = allWasteRates.map(item => item.genreName);
                data = allWasteRates.map(item => parseFloat(item.wasteRate.toFixed(2)));
                titleText = '食品ジャンル別 廃棄率 (%)';
                totalRate = '全ジャンルの内訳';

                const backgroundColors = data.map(rate => {
                    if (rate > 40) return COLOR_HIGH;
                    else if (rate > 20) return COLOR_MEDIUM;
                    else if (rate > 0) return COLOR_LOW;
                    else return COLOR_ZERO;
                });
                var finalBackgroundColors = backgroundColors;

                drawLegend(true);
            } else {
                const selectedItem = allWasteRates.find(item => item.genreName === selectedGenre);
                const rate = parseFloat(selectedItem.wasteRate.toFixed(2));

                labels = ['廃棄率 (%)', '非廃棄率 (%)'];
                data = [rate, 100.00 - rate];
                titleText = selectedGenre + ' の廃棄状況';
                totalRate = selectedGenre + ' の廃棄率: ' + rate.toFixed(2) + ' %';

                var finalBackgroundColors = [COLOR_HIGH, '#4BC0C0'];

                drawLegend(false);
            }

            if (wasteChart) {
                wasteChart.destroy();
            }

            wasteChart = new Chart(ctx, {
                type: 'pie',
                data: {
                    labels: labels,
                    datasets: [{
                        label: '割合 (%)',
                        data: data,
                        backgroundColor: finalBackgroundColors,
                        hoverOffset: 8
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: {
                        legend: {
                            display: true,
                            position: window.innerWidth < 768 ? 'bottom' : 'right',
                        },
                        title: {
                            display: true,
                            text: titleText,
                            font: {
                                size: window.innerWidth < 768 ? 12 : 14
                            }
                        },
                        datalabels: {
                            color: '#333',
                            formatter: (value, context) => {
                                if (value === 0) return '';
                                const label = context.chart.data.labels[context.dataIndex];
                                return window.innerWidth < 480 ? `${value.toFixed(1)}%` : `${label}\n${value.toFixed(1)}%`;
                            },
                            font: {
                                weight: 'bold',
                                size: window.innerWidth < 480 ? 10 : 14,
                            },
                            padding: 6
                        }
                    }
                }
            });

            rateDisplay.textContent = totalRate;
            updateDetailTable(selectedGenre);
        }

        function updateDetailTable(selectedGenre) {
            detailBody.innerHTML = '';

            const filteredDetails = selectedGenre === 'all'
                ? allWasteDetails
                : allWasteDetails.filter(detail => detail.genreName === selectedGenre);

            detailHeader.textContent = selectedGenre === 'all'
                ? '全ジャンルの'
                : selectedGenre + ' の';

            if (filteredDetails.length === 0) {
                const row = detailBody.insertRow();
                const cell = row.insertCell();
                cell.colSpan = 3;
                cell.textContent = '廃棄された食品はありません。';
                return;
            }

            filteredDetails.forEach(detail => {
                const row = detailBody.insertRow();
                row.insertCell().textContent = detail.foodName;
                row.insertCell().textContent = detail.wasteAmount.toFixed(2);

                const genreCell = row.insertCell();
                genreCell.textContent = detail.genreName;
            });

            const headerRow = document.querySelector('#wasteDetailTable thead tr');
            const genreHeader = headerRow.cells[2];
            const genreCells = document.querySelectorAll('#wasteDetailTable tbody tr > td:nth-child(3)');

            if (selectedGenre === 'all') {
                genreHeader.style.display = '';
                genreCells.forEach(cell => cell.style.display = '');
            } else {
                genreHeader.style.display = 'none';
                genreCells.forEach(cell => cell.style.display = 'none');
            }
        }

        genreSelector.addEventListener('change', (event) => {
            updateChart(event.target.value);
        });

        // ウィンドウリサイズ時にチャートを再描画
        window.addEventListener('resize', () => {
            if (wasteChart) {
                updateChart(genreSelector.value);
            }
        });

        updateChart('all');
    </script>
</body>
</html>
